<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout :: head('Chatbot')}"></head>

<body th:replace="~{layout :: page('Chatbot', ~{::content})}">

<th:block th:fragment="content">

    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6"><h1 class="m-0">Chatbot</h1></div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
                        <li class="breadcrumb-item active">Chatbot</li>
                    </ol>
                </div>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="container-fluid">

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title"><i class="fas fa-robot mr-1"></i> Ask the Chatbot</h3>
                </div>

                <div class="card-body">
                    <form th:action="@{/chatbot}" th:object="${input}" method="post">
                        <div class="form-group">
                            <label>Your question</label>
                            <textarea class="form-control" th:field="*{message}" rows="4"
                                      placeholder="Type: hi / how to apply / upload cv / interview tips ..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane mr-1"></i> Send
                        </button>
                    </form>

                    <div th:if="${response}" class="mt-4">
                        <div class="p-3 border rounded bg-light">
                            <div class="d-flex align-items-center mb-2">
                                <i class="fas fa-robot mr-2 text-muted"></i>
                                <strong>Response</strong>
                            </div>

                            <!-- ✅ keeps new lines -->
                            <pre class="mb-0"
                                 th:text="${response}"
                                 style="white-space: pre-wrap; font-family: inherit;"></pre>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </section>

</th:block>
</body>
</html>
