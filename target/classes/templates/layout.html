<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle} ?: 'JobPlatform'">JobPlatform</title>

    <!-- AdminLTE 3 (Bootstrap 4) + Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">

    <style>
        .brand-link { font-weight: 700; }
        .content-wrapper { padding: 12px; }
        .card { border-radius: 12px; }
        .btn { border-radius: 10px; }
    </style>
</head>

<body class="hold-transition sidebar-mini layout-fixed"
      th:fragment="page(pageTitle, content)">

<div class="wrapper">

    <!-- Topbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light"
         sec:authorize="isAuthenticated()"
         th:replace="~{fragments/topbar :: topbar}">
    </nav>

    <!-- Sidebar -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4"
           sec:authorize="isAuthenticated()"
           th:replace="~{fragments/sidebar :: sidebar}">
    </aside>

    <!-- Content -->
    <div class="content-wrapper">
        <section class="content">
            <div class="container-fluid">

                <!-- Flash message -->
                <div th:if="${message}" class="alert alert-info">
                    <span th:text="${message}">Message</span>
                </div>

                <!-- Page content -->
                <div th:replace="${content}">Content</div>

            </div>
        </section>
    </div>

    <footer class="main-footer text-sm">
        <strong>JobPlatform</strong> — Spring Boot + Thymeleaf + Security
    </footer>

</div>

<!-- AdminLTE scripts -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
