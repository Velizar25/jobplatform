<nav th:fragment="topbar"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
     class="main-header navbar navbar-expand navbar-white navbar-light">

    <!-- left -->
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#" role="button">
                <i class="fas fa-bars"></i>
            </a>
        </li>
        <li class="nav-item d-none d-sm-inline-block">
            <a th:href="@{/jobs}" class="nav-link">Jobs</a>
        </li>
        <li class="nav-item d-none d-sm-inline-block">
            <a th:href="@{/applications}" class="nav-link">Applications</a>
        </li>
    </ul>

    <!-- right -->
    <ul class="navbar-nav ml-auto" sec:authorize="isAuthenticated()">
        <li class="nav-item">
      <span class="nav-link">
        Signed in as <strong sec:authentication="name">user</strong>
      </span>
        </li>
        <li class="nav-item">
            <a th:href="@{/profile}" class="nav-link">
                <i class="far fa-user"></i> Profile
            </a>
        </li>
        <li class="nav-item">
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button class="btn btn-link nav-link" type="submit" style="padding:0;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </form>
        </li>
    </ul>
</nav>
