<aside th:fragment="sidebar"
       xmlns:th="http://www.thymeleaf.org"
       xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
       class="main-sidebar sidebar-dark-primary elevation-4">

    <a th:href="@{/jobs}" class="brand-link">
        <span class="brand-text font-weight-light"><b>Job</b>Platform</span>
    </a>

    <div class="sidebar">
        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">

                <li class="nav-item">
                    <a th:href="@{/jobs}" class="nav-link">
                        <i class="nav-icon fas fa-briefcase"></i>
                        <p>Jobs</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/applications}" class="nav-link">
                        <i class="nav-icon fas fa-file-alt"></i>
                        <p>Applications</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/my-cvs}" class="nav-link">
                        <i class="nav-icon fas fa-folder-open"></i>
                        <p>My CVs</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/cv/upload}" class="nav-link">
                        <i class="nav-icon fas fa-upload"></i>
                        <p>Upload CV</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/chatbot}" class="nav-link">
                        <i class="nav-icon fas fa-robot"></i>
                        <p>Chatbot</p>
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/jobs/new}" class="nav-link">
                        <i class="nav-icon fas fa-plus"></i>
                        <p>Post Job</p>
                    </a>
                </li>

            </ul>
        </nav>
    </div>
</aside>
