<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>Jobs – Recycle Bin</title>
    <style>
        body { font-family: system-ui, Arial, sans-serif; margin: 24px; }
        header { display:flex; gap:12px; align-items:center; margin-bottom:16px; flex-wrap: wrap; }
        a.button, button { padding:8px 12px; border:1px solid #ccc; background:#f9f9f9; cursor:pointer; border-radius:6px; text-decoration:none; }
        .msg { padding:10px; background:#eef9ee; border:1px solid #b8e3b8; border-radius:6px; margin-bottom:12px; }
        .card { border:1px solid #e5e7eb; border-radius:8px; padding:12px; margin-bottom:12px;}
    </style>
</head>
<body>
<header>
    <h1 style="margin:0;">Jobs – Recycle Bin</h1>
    <a class="button" th:href="@{/jobs}">Back to active</a>

    <form th:action="@{/jobs/restore-all}" method="post" sec:authorize="authentication?.name == 'admin'"
          onsubmit="return confirm('Restore ALL jobs?')">
        <button type="submit">Restore all</button>
    </form>
</header>

<div th:if="${message}" class="msg" th:text="${message}"></div>

<div th:if="${#lists.isEmpty(jobs)}">
    <p>No deleted jobs.</p>
</div>

<div th:each="j : ${jobs}" class="card">
    <strong th:text="${j.title}">Title</strong>
    <span class="text-muted" th:if="${j.location}"> – <span th:text="${j.location}">Location</span></span>
    <div th:if="${j.description}" th:text="${j.description}">Description</div>
</div>
</body>
</html>
