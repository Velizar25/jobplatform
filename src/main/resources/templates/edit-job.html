<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout :: head('Edit job')}"></head>

<body th:replace="~{layout :: page('Edit job', ~{::content})}">

<th:block th:fragment="content">

    <div class="content-header">
        <div class="container-fluid">
            <h1 class="m-0">Edit job</h1>
        </div>
    </div>

    <div class="container-fluid">
        <div class="col-lg-8">

            <div class="card">
                <form th:action="@{'/jobs/' + ${job.id} + '/edit'}"
                      th:object="${job}"
                      method="post">

                    <div class="card-body">

                        <div class="form-group">
                            <label>Title</label>
                            <input class="form-control"
                                   th:field="*{title}"
                                   required>
                        </div>

                        <!-- ✅ NEW: Company -->
                        <div class="form-group">
                            <label>Company</label>
                            <input class="form-control"
                                   th:field="*{company}"
                                   placeholder="e.g. BrightCode Studio"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Location</label>
                            <input class="form-control"
                                   th:field="*{location}"
                                   placeholder="e.g. Sofia">
                        </div>

                        <!-- ✅ NEW: Employment type -->
                        <div class="form-group">
                            <label>Employment type</label>
                            <input class="form-control"
                                   th:field="*{employmentType}"
                                   placeholder="e.g. Full-time (Hybrid)">
                        </div>

                        <div class="form-group">
                            <label>Description</label>
                            <textarea class="form-control"
                                      rows="10"
                                      th:field="*{description}"
                                      required></textarea>
                        </div>

                    </div>

                    <div class="card-footer d-flex" style="gap:10px;">
                        <button class="btn btn-primary" type="submit">
                            <i class="fas fa-save mr-1"></i> Save changes
                        </button>

                        <a class="btn btn-outline-secondary" th:href="@{/jobs}">
                            Cancel
                        </a>
                    </div>

                </form>
            </div>

        </div>
    </div>

</th:block>
</body>
</html>
