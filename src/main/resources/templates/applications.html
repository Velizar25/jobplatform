<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Applications')}"></head>

<body th:replace="~{layout :: page('Applications', ~{::content})}">

<th:block th:fragment="content">

    <div class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6"><h1 class="m-0">Applications</h1></div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item"><a th:href="@{/jobs}">Jobs</a></li>
                        <li class="breadcrumb-item active">Applications</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">

        <div class="mb-3">
            <a class="btn btn-outline-secondary" th:href="@{/jobs}">
                <i class="fas fa-arrow-left mr-1"></i> Back to jobs
            </a>
        </div>

        <div th:if="${#lists.isEmpty(apps)}" class="card">
            <div class="card-body">
                <p class="mb-0 text-muted">No applications yet.</p>
            </div>
        </div>

        <div class="card" th:if="${!#lists.isEmpty(apps)}">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-file-signature mr-2"></i> Applications
                </h3>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th style="width:60px;">#</th>
                            <th>Job title</th>
                            <th sec:authorize="hasRole('ADMIN')">Applicant email</th>
                            <th style="width:140px;">Status</th>
                            <th style="width:160px;">CV</th>
                            <th style="width:140px;">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="a, iStat : ${apps}">
                            <td th:text="${iStat.index + 1}">1</td>
                            <td th:text="${a.jobTitle}">Java Developer</td>

                            <td sec:authorize="hasRole('ADMIN')" th:text="${a.email}">you@example.com</td>

                            <td>
                                <span class="badge badge-info" th:text="${a.status}">Submitted</span>
                            </td>

                            <td>
                                <span th:if="${a.cv != null}">
                                    <a class="btn btn-sm btn-outline-primary"
                                       th:href="@{'/cvs/' + ${a.cv.id} + '/download'}">
                                        <i class="fas fa-download mr-1"></i> Download
                                    </a>
                                </span>
                                <span th:if="${a.cv == null}" class="text-muted">—</span>
                            </td>

                            <td>
                                <form th:action="@{'/applications/' + ${a.id} + '/delete'}"
                                      method="post"
                                      onsubmit="return confirm('Delete this application?')"
                                      class="m-0">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="fas fa-trash mr-1"></i> Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

</th:block>
</body>
</html>
