<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout :: head('Home')}"></head>

<body th:replace="~{layout :: page('Home', ~{::content})}">

<th:block th:fragment="content">

    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6"><h1 class="m-0">Home</h1></div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item active">Home</li>
                    </ol>
                </div>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="container-fluid">

            <div class="row">
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title font-weight-bold">
                                Welcome to JobPlatform
                            </h3>
                        </div>
                        <div class="card-body">
                            <p class="text-muted mb-3">
                                Browse jobs, apply with your CV, and manage your applications.
                            </p>

                            <div class="d-flex flex-wrap" style="gap:10px;">
                                <a class="btn btn-primary" th:href="@{/jobs}">
                                    <i class="fas fa-briefcase mr-1"></i> Browse jobs
                                </a>

                                <a class="btn btn-outline-secondary" th:href="@{/applications}">
                                    <i class="fas fa-file-signature mr-1"></i> Applications
                                </a>

                                <a class="btn btn-outline-secondary" th:href="@{/cvs}">
                                    <i class="fas fa-folder-open mr-1"></i> My CVs
                                </a>

                                <a class="btn btn-outline-secondary" th:href="@{/cvs/upload}">
                                    <i class="fas fa-upload mr-1"></i> Upload CV
                                </a>

                                <a class="btn btn-outline-secondary" th:href="@{/chatbot}">
                                    <i class="fas fa-robot mr-1"></i> Chatbot
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="info-box">
                        <span class="info-box-icon bg-info"><i class="fas fa-user"></i></span>
                        <div class="info-box-content">
                            <span class="info-box-text">Signed in as</span>
                            <span class="info-box-number" sec:authentication="name">user</span>
                        </div>
                    </div>

                    <div class="callout callout-info">
                        <h5 class="mb-1">Tip</h5>
                        <p class="mb-0 text-muted">
                            Use the sidebar to navigate faster between Jobs, CVs and Applications.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </section>

</th:block>
</body>
</html>
