<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout :: head('Upload CV')}"></head>

<body th:replace="~{layout :: page('Upload CV', ~{::content})}">

<th:block th:fragment="content">

  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6"><h1 class="m-0">Upload CV</h1></div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a th:href="@{/home}">Home</a></li>
            <li class="breadcrumb-item active">Upload CV</li>
          </ol>
        </div>
      </div>
    </div>
  </section>

  <section class="content">
    <div class="container-fluid">

      <div th:if="${message}" class="alert alert-info">
        <span th:text="${message}">Message</span>
      </div>

      <div class="card">
        <div class="card-body">
          <form th:action="@{/cv/upload}" method="post" enctype="multipart/form-data">
            <div class="form-group">
              <label>CV file (PDF / DOC / DOCX)</label>
              <div class="custom-file">
                <input type="file" class="custom-file-input" id="cvUpload" name="cv" required>
                <label class="custom-file-label" for="cvUpload">Choose file</label>
              </div>
              <small class="form-text text-muted">Max size: 20MB</small>
            </div>

            <button type="submit" class="btn btn-primary">
              <i class="fas fa-upload mr-1"></i> Upload
            </button>

            <a class="btn btn-outline-secondary ml-2" th:href="@{/my-cvs}">
              <i class="fas fa-id-card mr-1"></i> My CVs
            </a>
          </form>
        </div>
      </div>

    </div>
  </section>

  <script>
    document.addEventListener("change", function (e) {
      if (e.target && e.target.id === "cvUpload") {
        const fileName = e.target.files && e.target.files.length ? e.target.files[0].name : "Choose file";
        const label = document.querySelector("label[for='cvUpload'].custom-file-label");
        if (label) label.textContent = fileName;
      }
    });
  </script>

</th:block>
</body>
</html>
